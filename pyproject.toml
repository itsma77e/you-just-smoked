[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "you-just-smoked"
version = "0.1.0"
description = "A local webcam companion that notices when you're about to smoke and nudges you, once, to wait a little longer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "you-just-smoked contributors" }]
keywords = ["quit-smoking", "computer-vision", "mediapipe", "habit-tracking", "privacy-first", "webcam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "mediapipe==1.1.1",
    "numpy>=2.0,<3",
    "pillow>=11,<14",
    "pystray==0.19.5",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[project.scripts]
you-just-smoked = "you_just_smoked.cli:main"

[project.urls]
Homepage = "https://github.com/itsma77e/you-just-smoked"
Issues = "https://github.com/itsma77e/you-just-smoked/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/you_just_smoked"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "N", "PL", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["you_just_smoked"]
known-local-folder = ["factories", "fakes"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src:tests"
explicit_package_bases = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pystray.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
